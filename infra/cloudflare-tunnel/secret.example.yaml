# TEMPLATE ONLY — do NOT commit a real tunnel token.
#
# The deployment references this Secret (name: cloudflare-tunnel-token, key: token).
# Create it out-of-band rather than committing the value, e.g.:
#
#   kubectl -n cf-tunnel create secret generic cloudflare-tunnel-token \
#     --from-literal=token='<TUNNEL_TOKEN_FROM_CLOUDFLARE_DASHBOARD>'
#
# Or manage it via Sealed Secrets / External Secrets / a secrets store CSI driver.
# This file is a shape reference for whichever mechanism you use.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token
  namespace: cf-tunnel
type: Opaque
stringData:
  token: REPLACE_ME_DO_NOT_COMMIT
